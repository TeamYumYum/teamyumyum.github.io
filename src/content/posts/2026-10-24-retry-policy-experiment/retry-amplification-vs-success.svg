<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">정책별 재시도 증폭률과 최종 성공률</title>
  <desc id="desc">재시도 증폭률은 고정 2초 6.00, 지수 백오프 5.82, full jitter 5.77로 거의 같다. 최종 성공률은 재시도 없음 0%, 고정 2초 17.4%, 지수 백오프 36.1%, full jitter 85.3%다.</desc>
  <rect width="1120" height="470" rx="24" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif">
    <text x="48.0" y="57.0" font-size="27" font-weight="700" fill="#17212e" text-anchor="start">시도는 거의 같은데, 성공률은 두 배가 넘게 차이 나요</text>
    <text x="48.0" y="89.0" font-size="16" font-weight="400" fill="#526174" text-anchor="start">시드 5개 평균 · 막대 끝 가는 선은 시드 5개의 최솟값~최댓값</text>
    <text x="230.0" y="150.0" font-size="16" font-weight="700" fill="#17212e" text-anchor="start">재시도 증폭률 (시도 수 ÷ 클라이언트 수)</text>
    <text x="620.0" y="150.0" font-size="16" font-weight="700" fill="#17212e" text-anchor="start">최종 성공률</text>
    <path d="M230.0 165V412" stroke="#e2e8f0"/>
