    <text x="326.7" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">2</text>
    <path d="M423.3 165V412" stroke="#e2e8f0"/>
    <text x="423.3" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">4</text>
    <path d="M520.0 165V412" stroke="#e2e8f0"/>
    <text x="520.0" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">6</text>
    <path d="M620.0 165V412" stroke="#e2e8f0"/>
    <text x="620.0" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">0%</text>
    <path d="M725.0 165V412" stroke="#e2e8f0"/>
    <text x="725.0" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">25%</text>
    <path d="M830.0 165V412" stroke="#e2e8f0"/>
    <text x="830.0" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">50%</text>
    <path d="M935.0 165V412" stroke="#e2e8f0"/>
    <text x="935.0" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">75%</text>
    <path d="M1040.0 165V412" stroke="#e2e8f0"/>
    <text x="1040.0" y="432.0" font-size="13" font-weight="400" fill="#8a96a6" text-anchor="middle">100%</text>
    <text x="210.0" y="196.0" font-size="16" font-weight="600" fill="#17212e" text-anchor="end">재시도 없음</text>
