<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="920" viewBox="0 0 1040 920" role="img" aria-labelledby="title desc">
<title id="title">사진 인식 · 대기 시간과 트랜잭션</title>
<desc id="desc">폰에서 사진을 업로드하고 Spring 서버가 AI 연결과 인식 결과를 기다린 뒤 DB 트랜잭션으로 저장하고 응답하는 흐름. 연결은 최대 2초, 인식은 최대 10초이며 저장 실패 시 전체 롤백한다.</desc>
