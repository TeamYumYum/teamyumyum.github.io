<svg xmlns="http://www.w3.org/2000/svg" width="720" height="325" viewBox="0 0 720 325" role="img" aria-labelledby="title desc">
<title id="title">필수 근거 A와 B의 확보 비교</title><desc id="desc">한 문항의 개념 예시. 위쪽은 상위 5개에서 A만 찾아 Recall 50%, 전체 근거 미확보. 아래쪽은 A와 B를 찾아 Recall 100%, 전체 근거 확보. 첫 근거는 모두 1위다.</desc>
<rect x="0" y="0" width="720" height="325" rx="20" fill="#f7f9fc" stroke="none" stroke-width="1"/>
<g font-family="Pretendard, 'Malgun Gothic', sans-serif"><text x="32" y="43" font-size="26" fill="#172b46" font-weight="600" text-anchor="start">상위 5개</text><text x="516" y="43" font-size="26" fill="#172b46" font-weight="600" text-anchor="start">Recall@5</text><text x="66" y="79" font-size="22" fill="#52647a" font-weight="500" text-anchor="middle">1</text><text x="146" y="79" font-size="22" fill="#52647a" font-weight="500" text-anchor="middle">2</text><text x="226" y="79" font-size="22" fill="#52647a" font-weight="500" text-anchor="middle">3</text><text x="306" y="79" font-size="22" fill="#52647a" font-weight="500" text-anchor="middle">4</text><text x="386" y="79" font-size="22" fill="#52647a" font-weight="500" text-anchor="middle">5</text><rect x="32" y="95" width="68" height="64" rx="10" fill="#175ac8" stroke="none" stroke-width="1"/><text x="66" y="139" font-size="37" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><rect x="112" y="95" width="68" height="64" rx="10" fill="#e4e9f0" stroke="none" stroke-width="1"/><text x="146" y="139" font-size="37" fill="#7b899b" font-weight="700" text-anchor="middle">–</text><rect x="192" y="95" width="68" height="64" rx="10" fill="#e4e9f0" stroke="none" stroke-width="1"/><text x="226" y="139" font-size="37" fill="#7b899b" font-weight="700" text-anchor="middle">–</text><rect x="272" y="95" width="68" height="64" rx="10" fill="#e4e9f0" stroke="none" stroke-width="1"/><text x="306" y="139" font-size="37" fill="#7b899b" font-weight="700" text-anchor="middle">–</text><rect x="352" y="95" width="68" height="64" rx="10" fill="#e4e9f0" stroke="none" stroke-width="1"/><text x="386" y="139" font-size="37" fill="#7b899b" font-weight="700" text-anchor="middle">–</text><text x="516" y="138" font-size="42" fill="#172b46" font-weight="700" text-anchor="start">50%</text><text x="516" y="175" font-size="24" fill="#99450b" font-weight="600" text-anchor="start">전체 미확보</text><rect x="32" y="216" width="68" height="64" rx="10" fill="#175ac8" stroke="none" stroke-width="1"/><text x="66" y="260" font-size="37" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><rect x="112" y="216" width="68" height="64" rx="10" fill="#06755b" stroke="none" stroke-width="1"/><text x="146" y="260" font-size="37" fill="#ffffff" font-weight="700" text-anchor="middle">B</text><rect x="192" y="216" width="68" height="64" rx="10" fill="#e4e9f0" stroke="none" stroke-width="1"/><text x="226" y="260" font-size="37" fill="#7b899b" font-weight="700" text-anchor="middle">–</text><rect x="272" y="216" width="68" height="64" rx="10" fill="#e4e9f0" stroke="none" stroke-width="1"/><text x="306" y="260" font-size="37" fill="#7b899b" font-weight="700" text-anchor="middle">–</text><rect x="352" y="216" width="68" height="64" rx="10" fill="#e4e9f0" stroke="none" stroke-width="1"/><text x="386" y="260" font-size="37" fill="#7b899b" font-weight="700" text-anchor="middle">–</text><text x="516" y="259" font-size="42" fill="#172b46" font-weight="700" text-anchor="start">100%</text><text x="516" y="296" font-size="24" fill="#06755b" font-weight="600" text-anchor="start">전체 확보</text></g></svg>
