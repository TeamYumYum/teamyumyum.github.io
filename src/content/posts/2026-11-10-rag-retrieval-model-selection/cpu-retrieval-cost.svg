<title id="title">최종 검색 조합의 지연과 메모리</title><desc id="desc">검색 p95는 BM25+SO 27.29ms, KURE+O1 301.75ms. 프로세스 최대 메모리는 각각 57.07MiB와 2798.45MiB. 각 패널은 서로 다른 단위이며 0에서 시작한다. 측정 조건과 한계는 본문을 따른다.</desc>
