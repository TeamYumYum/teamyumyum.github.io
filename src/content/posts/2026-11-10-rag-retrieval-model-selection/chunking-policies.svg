y="372" width="274.2857142857143" height="48" rx="5" fill="#175ac8" stroke="none" stroke-width="1"/><text x="337.1428571428571" y="405" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle"></text><rect x="405.7142857142857" y="438" width="274.2857142857143" height="48" rx="5" fill="#175ac8" stroke="none" stroke-width="1"/><text x="542.8571428571429" y="471" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle"></text><rect x="405.7142857142857" y="372" width="68.57142857142856" height="48" rx="0" fill="#b44c0b" stroke="none" stroke-width="1"/><rect x="405.7142857142857" y="438" width="68.57142857142856" height="48" rx="0" fill="#b44c0b" stroke="none" stroke-width="1"/><text x="337.1428571428571" y="405" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">1~180자</text><text x="542.8571428571429" y="471" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">136~315자</text><path d="M405.7142857142857 500V516H474.2857142857143V500" fill="none" stroke="#b44c0b" stroke-width="2"/><text x="440" y="553" font-size="25" fill="#b44c0b" font-weight="700" text-anchor="middle">136~180자 = 45자</text></g></svg>
