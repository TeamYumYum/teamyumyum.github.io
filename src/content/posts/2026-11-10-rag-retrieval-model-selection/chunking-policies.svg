<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">고정 180자 청킹의 겹침 유무</title><desc id="desc">315자 원문에서 R0는 첫 조각 1~180자, 다음 조각 181~315자를 만든다. O1은 첫 조각 1~180자, 다음 조각 136~315자를 만든다. O1의 두 조각은 원문의 136~180자 45개를 공통으로 담는다. 원문의 같은 위치를 가로 좌표로 정렬했으며 상자 길이는 문자 수에 비례한다. R0의 마지막 조각은 남은 135자다.</desc>
<rect x="0" y="0" width="720" height="580" rx="20" fill="#f7f9fc" stroke="none" stroke-width="1"/>
