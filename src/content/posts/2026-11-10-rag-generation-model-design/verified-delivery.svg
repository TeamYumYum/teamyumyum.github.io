<svg xmlns="http://www.w3.org/2000/svg" width="720" height="439" viewBox="0 0 720 439" role="img" aria-labelledby="title desc">
<title id="title">검증한 주장을 전달하는 시점</title><desc id="desc">검토된 의도 경로는 주장 하나가 완성되면 해당 주장을 검사한 뒤 claim 이벤트를 전달한다. 응답이 끝나면 전체 검사를 거쳐 done을 보낸다. 로컬 후보 경로는 전체 응답을 검사한 후 claim들과 done을 전달한다. 초기 API 평가는 이 그림의 서비스 경로와 별도의 비스트리밍 평가다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#625b71" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="720" height="439" rx="20" fill="#f7f5fb" stroke="none"/>
<g font-family="Pretendard, 'Malgun Gothic', sans-serif"><text x="28" y="44" font-size="29" fill="#282239" font-weight="700" text-anchor="start">검토된 의도 경로</text><rect x="28" y="74" width="190" height="65" rx="10" fill="#eae2f8" stroke="none"/><text x="123" y="117" font-size="26" fill="#62409f" font-weight="700" text-anchor="middle">주장 하나 완성</text><path d="M228 106L254 106" fill="none" stroke="#625b71" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="265" y="74" width="190" height="65" rx="10" fill="#eae2f8" stroke="none"/><text x="360" y="117" font-size="26" fill="#62409f" font-weight="700" text-anchor="middle">해당 주장 검사</text><path d="M465 106L491 106" fill="none" stroke="#625b71" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="502" y="74" width="190" height="65" rx="10" fill="#08745a" stroke="none"/><text x="597" y="117" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">claim</text><rect x="28" y="164" width="190" height="65" rx="10" fill="#eae2f8" stroke="none"/><text x="123" y="207" font-size="26" fill="#62409f" font-weight="700" text-anchor="middle">응답 끝</text><path d="M228 196L254 196" fill="none" stroke="#625b71" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="265" y="164" width="190" height="65" rx="10" fill="#eae2f8" stroke="none"/><text x="360" y="207" font-size="26" fill="#62409f" font-weight="700" text-anchor="middle">전체 검사</text><path d="M465 196L491 196" fill="none" stroke="#625b71" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="502" y="164" width="190" height="65" rx="10" fill="#08745a" stroke="none"/><text x="597" y="207" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">done</text><path d="M28 264H692" stroke="#ddd7e8"/><text x="28" y="310" font-size="29" fill="#282239" font-weight="700" text-anchor="start">로컬 후보 경로</text><rect x="28" y="340" width="190" height="65" rx="10" fill="#eae2f8" stroke="none"/><text x="123" y="383" font-size="26" fill="#62409f" font-weight="700" text-anchor="middle">전체 응답</text><path d="M228 372L254 372" fill="none" stroke="#625b71" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="265" y="340" width="190" height="65" rx="10" fill="#eae2f8" stroke="none"/><text x="360" y="383" font-size="26" fill="#62409f" font-weight="700" text-anchor="middle">전체 검사</text><path d="M465 372L491 372" fill="none" stroke="#625b71" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="502" y="340" width="190" height="65" rx="10" fill="#08745a" stroke="none"/><text x="597" y="383" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">claim들 · done</text></g></svg>
