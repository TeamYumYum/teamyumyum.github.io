<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="title desc">
<title id="title">생성 모델과 코드의 역할 분담</title><desc id="desc">모델은 상태, 주장, 근거 ID를 반환한다. 코드는 필드 관계와 허용 ID를 검사하고 출처 정보를 구성한다. 주장과 인용 발췌가 의미상 연결되는지는 별도 검토한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#625b71" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="720" height="392" rx="20" fill="#f7f5fb" stroke="none"/>
<g font-family="Pretendard, 'Malgun Gothic', sans-serif"><rect x="28" y="28" width="294" height="281" rx="10" fill="#ffffff" stroke="#ddd7e8"/><rect x="398" y="28" width="294" height="281" rx="10" fill="#ffffff" stroke="#ddd7e8"/><text x="175" y="77" font-size="32" fill="#62409f" font-weight="700" text-anchor="middle">모델</text><text x="545" y="77" font-size="32" fill="#08745a" font-weight="700" text-anchor="middle">코드</text><rect x="51" y="104" width="248" height="48" rx="10" fill="#eae2f8" stroke="none"/><text x="175" y="137" font-size="28" fill="#62409f" font-weight="700" text-anchor="middle">상태</text><rect x="51" y="165" width="248" height="48" rx="10" fill="#eae2f8" stroke="none"/><text x="175" y="198" font-size="28" fill="#62409f" font-weight="700" text-anchor="middle">주장</text><rect x="51" y="226" width="248" height="48" rx="10" fill="#eae2f8" stroke="none"/><text x="175" y="259" font-size="28" fill="#62409f" font-weight="700" text-anchor="middle">근거 ID</text><text x="545" y="137" font-size="27" fill="#08745a" font-weight="600" text-anchor="middle">필드 관계 검사</text><text x="545" y="198" font-size="27" fill="#08745a" font-weight="600" text-anchor="middle">허용 ID 검사</text><text x="545" y="259" font-size="27" fill="#08745a" font-weight="600" text-anchor="middle">출처 정보 구성</text><path d="M336 184L382 184" fill="none" stroke="#625b71" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="358" font-size="28" fill="#282239" font-weight="700" text-anchor="middle">의미 검토: 주장 ↔ 인용 발췌</text></g></svg>
