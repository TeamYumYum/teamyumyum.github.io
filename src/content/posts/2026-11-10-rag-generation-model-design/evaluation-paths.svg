<svg xmlns="http://www.w3.org/2000/svg" width="720" height="455" viewBox="0 0 720 455" role="img" aria-labelledby="title desc">
<title id="title">평가군별 실제 처리 경로</title><desc id="desc">11월 6일 API 평가 40문항은 모델 응답 27개와 로컬 규칙 13개다. 11월 9일 새 평가 24문항은 모두 새로 추론했다. 회귀와 준비 확인 80문항은 기존 모델 응답 11개를 재생하고 69개를 기존 로컬 경로로 처리했다. 각 막대는 서로 다른 평가군의 구성 비율이며 품질 점수가 아니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#625b71" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="720" height="455" rx="20" fill="#f7f5fb" stroke="none"/>
<g font-family="Pretendard, 'Malgun Gothic', sans-serif"><text x="28" y="42" font-size="27" fill="#282239" font-weight="600" text-anchor="start">11/06 · API 평가 40문항</text><rect x="28" y="62" width="448.2" height="67" rx="0" fill="#62409f" stroke="none"/><text x="252.1" y="106" font-size="31" fill="#ffffff" font-weight="700" text-anchor="middle">모델 27</text><rect x="476.2" y="62" width="215.8" height="67" rx="0" fill="#08745a" stroke="none"/><text x="584.1" y="106" font-size="31" fill="#ffffff" font-weight="700" text-anchor="middle">규칙 13</text><text x="28" y="192" font-size="27" fill="#282239" font-weight="600" text-anchor="start">11/09 · 새 평가 24문항</text><rect x="28" y="212" width="664" height="67" rx="0" fill="#62409f" stroke="none"/><text x="360" y="256" font-size="31" fill="#ffffff" font-weight="700" text-anchor="middle">새 추론 24</text><text x="28" y="342" font-size="27" fill="#282239" font-weight="600" text-anchor="start">11/09 · 회귀·준비 확인 80문항</text><rect x="28" y="362" width="91.3" height="67" rx="0" fill="#a3480d" stroke="none"/><text x="73.65" y="406" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">재생 11</text><rect x="119.3" y="362" width="572.7" height="67" rx="0" fill="#08745a" stroke="none"/><text x="405.65000000000003" y="406" font-size="31" fill="#ffffff" font-weight="700" text-anchor="middle">규칙 69</text></g></svg>
