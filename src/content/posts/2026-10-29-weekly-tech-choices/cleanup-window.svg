<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">탈퇴 회원 정리 배치의 실행 시점</title>
  <desc id="desc">탈퇴한 날부터 7일 동안 매일 한국 시간 04시에 정리 배치가 그 회원을 다시 정리한다. 보통은 다음 날 04시 실행에서 끝나고, 한 번 실패해도 그다음 날 실행이 처리하므로 탈퇴 후 최대 2일 안에 처리된다. 서버가 시작될 때도 한 번 실행한다.</desc>
  <rect width="1120" height="400" rx="24" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif">
    <text x="48" y="57" font-size="27" font-weight="700" fill="#17212e">탈퇴 뒤 7일 동안, 매일 04:00에 다시 치워요</text>
    <text x="48" y="89" font-size="16" fill="#526174">정리는 몇 번을 돌려도 결과가 같아서, 같은 회원을 여러 번 처리해도 괜찮아요</text>

    <!-- window -->
    <rect x="120" y="168" width="840" height="40" rx="10" fill="#edfaf6"/>
    <text x="136" y="194" font-size="15" font-weight="700" fill="#067a5f">정리 창: 탈퇴 후 7일</text>

    <!-- axis -->
    <path d="M80 250H1072" stroke="#8a96a6" stroke-width="1.5"/>
    <g font-size="13" fill="#8a96a6" text-anchor="middle">
      <path d="M120 244V256M240 244V256M360 244V256M480 244V256M600 244V256M720 244V256M840 244V256M960 244V256" stroke="#8a96a6"/>
      <text x="120" y="276">탈퇴한 날</text>
      <text x="240" y="276">+1일</text>
      <text x="360" y="276">+2일</text>
      <text x="480" y="276">+3일</text>
      <text x="600" y="276">+4일</text>
      <text x="720" y="276">+5일</text>
      <text x="840" y="276">+6일</text>
      <text x="960" y="276">+7일</text>
    </g>

    <!-- withdrawal -->
    <circle cx="150" cy="250" r="8" fill="#17212e"/>
    <text x="150" y="152" font-size="13" font-weight="700" fill="#17212e" text-anchor="middle">탈퇴</text>
    <path d="M150 158V242" stroke="#17212e" stroke-dasharray="3 4"/>

    <!-- runs at 04:00 -->
    <g fill="#067a5f">
      <circle cx="260" cy="250" r="7"/>
      <circle cx="380" cy="250" r="7"/>
      <circle cx="500" cy="250" r="7"/>
      <circle cx="620" cy="250" r="7"/>
      <circle cx="740" cy="250" r="7"/>
      <circle cx="860" cy="250" r="7"/>
    </g>
    <path d="M260 258V312" stroke="#067a5f"/>
    <text x="260" y="332" font-size="14" font-weight="700" fill="#067a5f" text-anchor="middle">04:00 실행</text>
    <text x="260" y="352" font-size="13" fill="#526174" text-anchor="middle">보통 여기서 끝나요</text>
    <path d="M380 258V312" stroke="#067a5f"/>
    <text x="380" y="332" font-size="14" font-weight="700" fill="#067a5f" text-anchor="middle">04:00 실행</text>
    <text x="380" y="352" font-size="13" fill="#526174" text-anchor="middle">한 번 실패해도 여기서</text>
    <text x="380" y="370" font-size="13" fill="#526174" text-anchor="middle">→ "최대 2일"</text>
    <text x="680" y="332" font-size="13" fill="#526174" text-anchor="middle">창이 끝날 때까지 매일 다시 시도해요</text>
    <text x="680" y="352" font-size="13" fill="#526174" text-anchor="middle">서버가 시작될 때도 한 번 돌아요</text>
  </g>
</svg>
