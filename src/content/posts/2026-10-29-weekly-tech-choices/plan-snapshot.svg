<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">현재 몸무게와 코칭 계획의 시점 값</title>
  <desc id="desc">온보딩 때 시작 체중 70.0kg으로 계획 v1을 만들고, v1은 이 값을 그대로 들고 있다. 현재 몸무게는 기록할 때마다 69.3, 68.8, 68.4kg으로 바뀐다. 회원이 활동량을 바꾸면 계획에 재계산 대기가 켜지고, 회원이 다시 계산을 고르면 그때의 최신 체중 68.4kg으로 v2를 만든다. 그 뒤 67.9kg을 기록해도 v2는 그대로다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a6"/></marker>
  </defs>
  <rect width="1120" height="460" rx="24" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif">
    <text x="48" y="57" font-size="27" font-weight="700" fill="#17212e">계획은 만들 때의 몸무게를 그대로 들고 있어요</text>
    <text x="48" y="89" font-size="16" fill="#526174">현재 몸무게는 기록할 때마다 바뀌지만, 계획은 회원이 다시 계산을 고를 때만 새로 만들어요</text>

    <!-- lane labels -->
    <text x="48" y="172" font-size="15" font-weight="700" fill="#17212e">현재 몸무게</text>
    <text x="48" y="192" font-size="13" fill="#8a96a6">(체중 기록)</text>
    <text x="48" y="300" font-size="15" font-weight="700" fill="#17212e">코칭 계획</text>
    <text x="48" y="320" font-size="13" fill="#8a96a6">(시점 값)</text>
    <path d="M200 182H1072M200 306H1072" stroke="#e2e8f0"/>

    <!-- weight steps -->
    <path d="M240 182H420M420 182H620M620 182H780M780 182H960M960 182H1072" stroke="#1b64da" stroke-width="2"/>
    <g fill="#1b64da">
      <circle cx="240" cy="182" r="7"/>
      <circle cx="420" cy="182" r="7"/>
      <circle cx="620" cy="182" r="7"/>
      <circle cx="780" cy="182" r="7"/>
      <circle cx="960" cy="182" r="7"/>
    </g>
    <g font-size="14" font-weight="700" fill="#1b64da" text-anchor="middle">
      <text x="240" y="164">70.0</text>
      <text x="420" y="164">69.3</text>
      <text x="620" y="164">68.8</text>
      <text x="780" y="164">68.4</text>
      <text x="960" y="164">67.9</text>
    </g>
    <text x="250" y="210" font-size="12" fill="#8a96a6">시작 체중 = 첫 기록</text>

    <!-- plan bars -->
    <rect x="240" y="286" width="578" height="40" rx="10" fill="#eff6ff" stroke="#1b64da"/>
    <text x="256" y="311" font-size="15" fill="#17212e"><tspan font-weight="700" fill="#1b64da">계획 v1</tspan> · 몸무게 70.0kg으로 만든 계획</text>
    <rect x="822" y="286" width="250" height="40" rx="10" fill="#edfaf6" stroke="#067a5f"/>
    <text x="838" y="311" font-size="15" fill="#17212e"><tspan font-weight="700" fill="#067a5f">계획 v2</tspan> · 68.4kg</text>

    <!-- links -->
    <path d="M240 190V282" stroke="#8a96a6" stroke-dasharray="3 4" marker-end="url(#a)"/>
    <path d="M780 190C780 240 822 240 822 282" fill="none" stroke="#067a5f" stroke-dasharray="3 4" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- recalc pending -->
    <path d="M700 296L710 306L700 316L690 306Z" fill="#e14d00"/>
    <text x="700" y="356" font-size="13" font-weight="700" fill="#e14d00" text-anchor="middle">활동량을 바꿈</text>
    <text x="700" y="374" font-size="13" fill="#526174" text-anchor="middle">→ 재계산 대기</text>
    <text x="830" y="356" font-size="13" font-weight="700" fill="#067a5f" text-anchor="middle">다시 계산을 고름</text>
    <text x="830" y="374" font-size="13" fill="#526174" text-anchor="middle">→ 최신 체중으로 v2</text>
    <text x="960" y="240" font-size="13" fill="#526174" text-anchor="middle">새로 기록해도</text>
    <text x="960" y="258" font-size="13" fill="#526174" text-anchor="middle">v2는 그대로예요</text>

    <!-- axis -->
    <path d="M200 412H1072" stroke="#8a96a6" stroke-width="1.5"/>
    <g font-size="13" fill="#8a96a6" text-anchor="middle">
      <text x="240" y="434">온보딩</text>
      <text x="420" y="434">1주</text>
      <text x="620" y="434">2주</text>
      <text x="780" y="434">3주</text>
      <text x="960" y="434">4주</text>
    </g>
    <text x="1072" y="452" font-size="13" fill="#8a96a6" text-anchor="end">시간 →</text>
  </g>
</svg>
