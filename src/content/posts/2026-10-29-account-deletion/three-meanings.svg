<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">지운다의 세 가지 의미</title>
  <desc id="desc">첫째는 무엇을 지울지다. 회원의 행을 모두 지운다고 생각했지만, 행 대신 사람과의 연결을 지우기도 한다. 둘째는 지운 상태를 지키는 것이다. 쓰기 전에 탈퇴를 확인하면 된다고 생각했지만, 잠금으로 막거나 다시 치워서 수렴시켜야 한다. 셋째는 보이지 않는 곳까지 지우는 것이다. 보여 주기 전에 GPS를 지우면 된다고 생각했지만, 들어오는 곳에서 지우고 확실하지 않으면 받지 않는다.</desc>
  <rect width="1120" height="400" rx="24" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif">
    <text x="48" y="57" font-size="27" font-weight="700" fill="#17212e">"지운다"에는 세 가지 뜻이 있었어요</text>
    <text x="48" y="89" font-size="16" fill="#526174">위는 처음 떠올린 생각이고, 아래는 실제로 고른 원칙이에요</text>

    <!-- card 1 -->
    <rect x="48" y="120" width="325" height="248" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="80" cy="152" r="16" fill="#1b64da"/>
    <text x="80" y="158" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="106" y="159" font-size="19" font-weight="700" fill="#17212e">무엇을 지울까</text>
    <text x="68" y="204" font-size="13" font-weight="700" fill="#8a96a6">처음 생각</text>
    <text x="68" y="228" font-size="15" fill="#526174">회원의 행을 모두 지워요</text>
    <path d="M68 250H353" stroke="#e2e8f0"/>
    <text x="68" y="278" font-size="13" font-weight="700" fill="#1b64da">실제로는</text>
    <text x="68" y="304" font-size="16" font-weight="700" fill="#17212e">행 대신 사람과의 연결을</text>
    <text x="68" y="328" font-size="16" font-weight="700" fill="#17212e">지우기도 해요</text>

    <!-- card 2 -->
    <rect x="397" y="120" width="325" height="248" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="429" cy="152" r="16" fill="#067a5f"/>
    <text x="429" y="158" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="455" y="159" font-size="19" font-weight="700" fill="#17212e">지운 상태를 지키기</text>
    <text x="417" y="204" font-size="13" font-weight="700" fill="#8a96a6">처음 생각</text>
    <text x="417" y="228" font-size="15" fill="#526174">쓰기 전에 탈퇴를 확인해요</text>
    <path d="M417 250H702" stroke="#e2e8f0"/>
    <text x="417" y="278" font-size="13" font-weight="700" fill="#067a5f">실제로는</text>
    <text x="417" y="304" font-size="16" font-weight="700" fill="#17212e">잠금으로 막거나,</text>
    <text x="417" y="328" font-size="16" font-weight="700" fill="#17212e">다시 치워서 맞춰 가요</text>

    <!-- card 3 -->
    <rect x="746" y="120" width="326" height="248" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="778" cy="152" r="16" fill="#e14d00"/>
    <text x="778" y="158" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="804" y="159" font-size="19" font-weight="700" fill="#17212e">보이지 않는 곳까지</text>
    <text x="766" y="204" font-size="13" font-weight="700" fill="#8a96a6">처음 생각</text>
    <text x="766" y="228" font-size="15" fill="#526174">보여 주기 전에 GPS를 지워요</text>
    <path d="M766 250H1052" stroke="#e2e8f0"/>
    <text x="766" y="278" font-size="13" font-weight="700" fill="#e14d00">실제로는</text>
    <text x="766" y="304" font-size="16" font-weight="700" fill="#17212e">들어오는 곳에서 지우고,</text>
    <text x="766" y="328" font-size="16" font-weight="700" fill="#17212e">확실하지 않으면 받지 않아요</text>
  </g>
</svg>
