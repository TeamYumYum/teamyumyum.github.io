<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">GPS를 지우는 위치의 변화</title>
  <desc id="desc">처음에는 GPS가 남은 원본을 저장하고 인식 서버에도 보낸 뒤 관리자 화면에 보여 줄 때만 GPS를 지웠다. 지금은 사진을 만드는 순간 GPS를 지워서 저장소와 인식 서버 모두 GPS 없는 사진만 받는다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a6"/></marker>
  </defs>
  <rect width="1120" height="420" rx="24" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif">
    <text x="48" y="57" font-size="27" font-weight="700" fill="#17212e">GPS를 지우는 곳을 맨 앞으로 옮겼어요</text>
    <text x="48" y="89" font-size="16" fill="#526174">주황 테두리는 위치 정보가 남아 있는 사진이에요</text>

    <!-- before -->
    <text x="48" y="146" font-size="16" font-weight="700" fill="#8a96a6">처음 (관리자 조회 API를 만들 때)</text>
    <rect x="48" y="164" width="150" height="56" rx="12" fill="#ffffff" stroke="#e14d00" stroke-width="2"/>
    <text x="123" y="198" font-size="15" font-weight="700" fill="#17212e" text-anchor="middle">사진 업로드</text>
    <path d="M200 192H254" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>
    <rect x="258" y="164" width="200" height="56" rx="12" fill="#ffffff" stroke="#e14d00" stroke-width="2"/>
    <text x="358" y="198" font-size="15" font-weight="700" fill="#17212e" text-anchor="middle">저장 · 인식 서버</text>
    <path d="M460 192H514" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>
    <rect x="518" y="164" width="230" height="56" rx="12" fill="#eff6ff" stroke="#1b64da"/>
    <text x="633" y="198" font-size="15" font-weight="700" fill="#1b64da" text-anchor="middle">관리자 조회 때 GPS 제거</text>
    <path d="M750 192H804" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>
    <rect x="808" y="164" width="150" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="883" y="198" font-size="15" font-weight="700" fill="#17212e" text-anchor="middle">관리자 화면</text>
    <text x="48" y="248" font-size="14" fill="#e14d00">밖으로는 안 나가지만, 저장소와 인식 서버에는 위치가 남아요</text>

    <!-- after -->
    <text x="48" y="304" font-size="16" font-weight="700" fill="#067a5f">지금</text>
    <rect x="48" y="322" width="150" height="56" rx="12" fill="#ffffff" stroke="#e14d00" stroke-width="2"/>
    <text x="123" y="356" font-size="15" font-weight="700" fill="#17212e" text-anchor="middle">사진 업로드</text>
    <path d="M200 350H254" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>
    <rect x="258" y="322" width="260" height="56" rx="12" fill="#edfaf6" stroke="#067a5f"/>
    <text x="388" y="346" font-size="15" font-weight="700" fill="#067a5f" text-anchor="middle">사진을 만들 때 GPS 제거</text>
    <text x="388" y="366" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#526174" text-anchor="middle">MealPhoto.of</text>
    <path d="M520 350H574" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>
    <rect x="578" y="322" width="200" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="678" y="356" font-size="15" font-weight="700" fill="#17212e" text-anchor="middle">저장 · 인식 서버</text>
    <path d="M780 350H834" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>
    <rect x="838" y="322" width="150" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="913" y="356" font-size="15" font-weight="700" fill="#17212e" text-anchor="middle">관리자 화면</text>
  </g>
</svg>
