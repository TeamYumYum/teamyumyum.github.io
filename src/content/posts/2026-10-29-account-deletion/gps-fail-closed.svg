<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">GPS 제거의 fail-closed 판단 순서</title>
  <desc id="desc">사진의 세그먼트나 청크 구조를 읽을 수 없으면 사진을 거절한다. 구조를 읽을 수 있으면 첫 이미지 뒤에 붙은 바이트를 잘라 낸다. EXIF를 해석할 수 있으면 GPS 항목만 지우고 나머지 태그는 남긴다. EXIF를 해석할 수 없으면 EXIF 블록을 통째로 뺀다. XMP에 GPS가 들어 있으면 XMP 블록을 통째로 뺀다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a6"/></marker>
  </defs>
  <rect width="1120" height="600" rx="24" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif">
    <text x="48" y="57" font-size="27" font-weight="700" fill="#17212e">확실히 지울 수 없으면, 더 많이 지우거나 받지 않아요</text>
    <text x="48" y="89" font-size="16" fill="#526174">아래로 갈수록 사진을 잘 읽은 경우이고, 오른쪽이 그때 하는 일이에요</text>

    <!-- step 1 -->
    <rect x="48" y="124" width="420" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="68" y="154" font-size="16" font-weight="700" fill="#17212e">파일 구조(세그먼트·청크)를 읽을 수 있나요?</text>
    <text x="68" y="180" font-size="14" fill="#526174">JPEG APP 세그먼트, PNG·WebP 청크 길이</text>
    <path d="M470 160H574" stroke="#e14d00" stroke-width="2" marker-end="url(#a)"/>
    <text x="522" y="150" font-size="13" font-weight="700" fill="#e14d00" text-anchor="middle">아니요</text>
    <rect x="578" y="124" width="494" height="72" rx="12" fill="#fff2ec" stroke="#e14d00"/>
    <text x="598" y="154" font-size="16" font-weight="700" fill="#e14d00">사진을 받지 않아요</text>
    <text x="598" y="180" font-size="14" fill="#526174">업로드는 415로 거절, 예전에 저장된 사진은 관리자에게 보내지 않아요</text>
    <path d="M258 198V238" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>
    <text x="270" y="224" font-size="13" font-weight="700" fill="#067a5f">예</text>

    <!-- step 2 -->
    <rect x="48" y="242" width="420" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="68" y="276" font-size="16" font-weight="700" fill="#17212e">첫 이미지 뒤에 바이트가 더 붙어 있나요?</text>
    <path d="M470 270H574" stroke="#1b64da" stroke-width="2" marker-end="url(#a)"/>
    <text x="522" y="260" font-size="13" font-weight="700" fill="#1b64da" text-anchor="middle">예</text>
    <rect x="578" y="242" width="494" height="56" rx="12" fill="#eff6ff" stroke="#1b64da"/>
    <text x="598" y="276" font-size="15" fill="#17212e"><tspan font-weight="700" fill="#1b64da">잘라 내요</tspan> · 모션 포토의 동영상 같은 덧붙은 데이터</text>
    <path d="M258 300V340" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>

    <!-- step 3 -->
    <rect x="48" y="344" width="420" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="68" y="378" font-size="16" font-weight="700" fill="#17212e">XMP 블록 안에 GPS 글자가 있나요?</text>
    <path d="M470 372H574" stroke="#1b64da" stroke-width="2" marker-end="url(#a)"/>
    <text x="522" y="362" font-size="13" font-weight="700" fill="#1b64da" text-anchor="middle">예</text>
    <rect x="578" y="344" width="494" height="56" rx="12" fill="#eff6ff" stroke="#1b64da"/>
    <text x="598" y="378" font-size="15" fill="#17212e"><tspan font-weight="700" fill="#1b64da">XMP 블록을 통째로 빼요</tspan> · 압축돼서 볼 수 없어도 빼요</text>
    <path d="M258 402V442" stroke="#8a96a6" stroke-width="2" marker-end="url(#a)"/>

    <!-- step 4 -->
    <rect x="48" y="446" width="420" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="68" y="476" font-size="16" font-weight="700" fill="#17212e">EXIF(TIFF 구조)를 해석할 수 있나요?</text>
    <text x="68" y="502" font-size="14" fill="#526174">리틀·빅 엔디언 모두 읽어요</text>
    <path d="M470 466H574" stroke="#067a5f" stroke-width="2" marker-end="url(#a)"/>
    <text x="522" y="458" font-size="13" font-weight="700" fill="#067a5f" text-anchor="middle">예</text>
    <rect x="578" y="436" width="240" height="92" rx="12" fill="#edfaf6" stroke="#067a5f"/>
    <text x="594" y="464" font-size="15" font-weight="700" fill="#067a5f">GPS 항목만 지워요</text>
    <text x="594" y="488" font-size="13" fill="#526174">길이·오프셋 그대로,</text>
    <text x="594" y="508" font-size="13" fill="#526174">회전 정보도 남아요</text>
    <path d="M470 504H520V552H952V532" stroke="#e14d00" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="700" y="576" font-size="13" font-weight="700" fill="#e14d00" text-anchor="middle">아니요</text>
    <rect x="832" y="436" width="240" height="92" rx="12" fill="#fff2ec" stroke="#e14d00"/>
    <text x="848" y="464" font-size="15" font-weight="700" fill="#e14d00">EXIF 블록을 통째로 빼요</text>
    <text x="848" y="488" font-size="13" fill="#526174">회전 정보도 사라지지만</text>
    <text x="848" y="508" font-size="13" fill="#526174">위치 노출보다 나아요</text>
  </g>
</svg>
