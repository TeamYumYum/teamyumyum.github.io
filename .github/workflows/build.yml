name: Build

# 글 PR이 main에 들어가기 전에 빌드가 깨지지 않는지 확인한다. 배포는 deploy.yml이 맡는다.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
